[project]
name = "mindhive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["submission"]
testpaths = ["submission/tests"]
